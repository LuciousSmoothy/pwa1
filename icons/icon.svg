<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grad)" rx="80"/>

  <!-- Calendar Icon -->
  <rect x="140" y="120" width="232" height="272" fill="none" stroke="white" stroke-width="20" rx="15"/>
  <line x1="140" y1="180" x2="372" y2="180" stroke="white" stroke-width="20"/>
  <line x1="200" y1="100" x2="200" y2="140" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <line x1="312" y1="100" x2="312" y2="140" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Event dots -->
  <circle cx="200" cy="240" r="12" fill="white"/>
  <circle cx="256" cy="240" r="12" fill="white"/>
  <circle cx="312" cy="240" r="12" fill="white"/>
  <circle cx="200" cy="300" r="12" fill="white"/>
  <circle cx="256" cy="300" r="12" fill="white"/>

  <!-- Location pin -->
  <g transform="translate(380, 350)">
    <path d="M 0,-40 C -15,-40 -25,-30 -25,-15 C -25,0 0,30 0,30 C 0,30 25,0 25,-15 C 25,-30 15,-40 0,-40 Z"
          fill="#FF9800" stroke="white" stroke-width="3"/>
    <circle cx="0" cy="-15" r="8" fill="white"/>
  </g>
</svg>
